<svg width="988" height="232" xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 988 232" role="img" aria-label="Flujo de decisión para elegir un método de reducción" class="fk fk-svg"><style>.fk text{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#242424;stroke:none}.fk rect,.fk circle,.fk polygon{stroke-width:1.6}.fk .fk-line{stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}.fk .fk-muted{fill:#767676}.fk .fk-halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.fk .k-latent{fill:#f1ebfe;stroke:#976cf4}.fk .t-latent{fill:#6b45c9}.fk .k-ok{fill:#e2f8ee;stroke:#0fc373}.fk .s-ok{stroke:#0fc373}.fk .t-ok{fill:#0a8a52}.fk .k-neutral{fill:#f2f2f2;stroke:#767676}.fk .s-neutral{stroke:#767676}.fk .t-neutral{fill:#242424}</style><rect x="-14" y="-14" width="988" height="232" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" style="stroke-width:1"/><title>Flujo de decisión para elegir un método de reducción</title><desc>When the output feeds a model, PCA is the choice if a linear projection is enough and an autoencoder if it is not and there is plenty of data. When the output is only to look at, UMAP fits the case where new points must be placed or the dataset is very large, and t-SNE compared over several perplexities fits the rest. The outputs of PCA, an autoencoder and UMAP can feed clustering or a model, while a t-SNE map is only inspected.</desc><defs><marker id="fke8e3dc50-a-data" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#1174e6"/></marker><marker id="fke8e3dc50-a-model" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#23969a"/></marker><marker id="fke8e3dc50-a-latent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#976cf4"/></marker><marker id="fke8e3dc50-a-error" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#ff8c0a"/></marker><marker id="fke8e3dc50-a-anom" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#e65d6a"/></marker><marker id="fke8e3dc50-a-ok" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#0fc373"/></marker><marker id="fke8e3dc50-a-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#767676"/></marker></defs><g class="fk-box"><rect x="20" y="66" width="160" height="52" rx="6" class="k-neutral"/><text x="100" y="88.1" class="fk-tx t-neutral" font-size="13" font-weight="600" text-anchor="middle">¿Para qué se usa</text><text x="100" y="104.35" class="fk-tx t-neutral" font-size="13" font-weight="600" text-anchor="middle">la salida?</text></g><path d="M180,82 L286.88,39.25" class="fk-line s-neutral" fill="none" marker-end="url(#fke8e3dc50-a-neutral)"/><text font-weight="600" x="0" y="0" transform="translate(231.2,55) rotate(-21.8)" class="fk-tx fk-muted fk-halo" font-size="11" text-anchor="middle">Alimenta un modelo</text><g class="fk-box"><rect x="290" y="16" width="220" height="46" rx="6" class="k-neutral"/><text x="400" y="35.1" class="fk-tx t-neutral" font-size="13" font-weight="600" text-anchor="middle">¿Basta una proyección</text><text x="400" y="51.35" class="fk-tx t-neutral" font-size="13" font-weight="600" text-anchor="middle">lineal?</text></g><path d="M510,32 L636.65,24.21" class="fk-line s-neutral" fill="none" marker-end="url(#fke8e3dc50-a-neutral)"/><text font-weight="600" x="575" y="22" class="fk-tx fk-muted fk-halo" font-size="11" text-anchor="middle">Sí</text><g class="fk-box"><rect x="640" y="4" width="140" height="40" rx="6" class="k-latent"/><text x="710" y="21.35" class="fk-tx t-latent" font-size="13" font-weight="600" text-anchor="middle">PCA</text><text x="710" y="35.7" class="fk-tx fk-muted" font-size="11" font-weight="600" text-anchor="middle">Rápido, determinista</text></g><path d="M510,48 L636.67,65.54" class="fk-line s-neutral" fill="none" marker-end="url(#fke8e3dc50-a-neutral)"/><text font-weight="600" x="0" y="0" transform="translate(574.1,50.9) rotate(7.9)" class="fk-tx fk-muted fk-halo" font-size="11" text-anchor="middle">No, con muchos datos</text><g class="fk-box"><rect x="640" y="54" width="140" height="40" rx="6" class="k-latent"/><text x="710" y="71.35" class="fk-tx t-latent" font-size="13" font-weight="600" text-anchor="middle">Autoencoder</text><text x="710" y="85.7" class="fk-tx fk-muted" font-size="11" font-weight="600" text-anchor="middle">Aprendido, no lineal</text></g><path d="M180,104 L286.88,146.75" class="fk-line s-neutral" fill="none" marker-end="url(#fke8e3dc50-a-neutral)"/><text font-weight="600" x="0" y="0" transform="translate(235.6,119.8) rotate(21.8)" class="fk-tx fk-muted fk-halo" font-size="11" text-anchor="middle">Solo para visualizar</text><g class="fk-box"><rect x="290" y="126" width="220" height="46" rx="6" class="k-neutral"/><text x="400" y="145.1" class="fk-tx t-neutral" font-size="13" font-weight="600" text-anchor="middle">¿Puntos nuevos que ubicar</text><text x="400" y="161.35" class="fk-tx t-neutral" font-size="13" font-weight="600" text-anchor="middle">o datos muy grandes?</text></g><path d="M510,140 L636.65,128.31" class="fk-line s-neutral" fill="none" marker-end="url(#fke8e3dc50-a-neutral)"/><text font-weight="600" x="575" y="128" class="fk-tx fk-muted fk-halo" font-size="11" text-anchor="middle">Sí</text><g class="fk-box"><rect x="640" y="108" width="140" height="40" rx="6" class="k-latent"/><text x="710" y="125.35" class="fk-tx t-latent" font-size="13" font-weight="600" text-anchor="middle">UMAP</text><text x="710" y="139.7" class="fk-tx fk-muted" font-size="11" font-weight="600" text-anchor="middle">Mapa, puede transformar</text></g><path d="M510,156 L636.67,171.59" class="fk-line s-neutral" fill="none" marker-end="url(#fke8e3dc50-a-neutral)"/><text font-weight="600" x="575" y="158" class="fk-tx fk-muted fk-halo" font-size="11" text-anchor="middle">No</text><g class="fk-box"><rect x="640" y="158" width="140" height="40" rx="6" class="k-latent"/><text x="710" y="175.35" class="fk-tx t-latent" font-size="13" font-weight="600" text-anchor="middle">t-SNE</text><text x="710" y="189.7" class="fk-tx fk-muted" font-size="11" font-weight="600" text-anchor="middle">Comparar perplejidades</text></g><path d="M780,24 L828.15,97.19" class="fk-line s-ok" fill="none" stroke-dasharray="5 4" marker-end="url(#fke8e3dc50-a-ok)"/><path d="M780,74 L827.02,98.45" class="fk-line s-ok" fill="none" stroke-dasharray="5 4" marker-end="url(#fke8e3dc50-a-ok)"/><path d="M780,128 L827.07,101.64" class="fk-line s-ok" fill="none" stroke-dasharray="5 4" marker-end="url(#fke8e3dc50-a-ok)"/><g class="fk-box"><rect x="830" y="78" width="120" height="46" rx="6" class="k-ok"/><text x="890" y="97.1" class="fk-tx t-ok" font-size="13" font-weight="600" text-anchor="middle">Después, agrupar</text><text x="890" y="113.35" class="fk-tx t-ok" font-size="13" font-weight="600" text-anchor="middle">o modelar</text></g><path d="M780,178 L856.64,178" class="fk-line s-neutral" fill="none" stroke-dasharray="5 4" marker-end="url(#fke8e3dc50-a-neutral)"/><text font-weight="600" x="864" y="182" class="fk-tx fk-muted" font-size="11" text-anchor="start">Solo inspección</text></svg>
