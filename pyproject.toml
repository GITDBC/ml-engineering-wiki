[project]
name = "ml-engineering-wiki"
description = "Wiki sobre Ingeniería en Aprendizaje Automático"
authors = [
    {name = "Daniel Bazo Correa", email = "none@none.com"},
]
license = {file = "LICENSE"}
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.13"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]
keywords = ["machine learning", "data science", "software", "wiki"]
dependencies = [
    "zensical==0.0.71",
    "mike",
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true } }]

[tool.uv.sources]
mike = { git = "https://github.com/squidfunk/mike.git" }

[dependency-groups]
pipeline = [
    "pre-commit==4.5.1"
]
