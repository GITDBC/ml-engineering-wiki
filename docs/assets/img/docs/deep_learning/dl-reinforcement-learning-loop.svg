<svg width="988" height="302" xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 988 302" role="img" aria-label="Bucle de aprendizaje por refuerzo con estado, acción y recompensa" class="fk fk-svg"><style>.fk text{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#242424;stroke:none}.fk rect,.fk circle,.fk polygon{stroke-width:1.6}.fk .fk-line{stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}.fk .fk-soft{fill-opacity:.7}.fk .k-data{fill:#e8f1fd;stroke:#1174e6}.fk .s-data{stroke:#1174e6}.fk .t-data{fill:#0050ca}.fk .k-model{fill:#e4f3f3;stroke:#23969a}.fk .s-model{stroke:#23969a}.fk .t-model{fill:#1b7478}.fk .k-error{fill:#fff1e0;stroke:#ff8c0a}.fk .s-ok{stroke:#0fc373}.fk .t-ok{fill:#0a8a52}.fk .k-neutral{fill:#f2f2f2;stroke:#767676}.fk .fk-flow{stroke-dasharray:5 4}</style><rect x="-14" y="-14" width="988" height="302" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" style="stroke-width:1"/><title>Bucle de aprendizaje por refuerzo con estado, acción y recompensa</title><defs><marker id="fk77ef0cc0-a-data" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#1174e6"/></marker><marker id="fk77ef0cc0-a-model" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#23969a"/></marker><marker id="fk77ef0cc0-a-latent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#976cf4"/></marker><marker id="fk77ef0cc0-a-error" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#ff8c0a"/></marker><marker id="fk77ef0cc0-a-anom" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#e65d6a"/></marker><marker id="fk77ef0cc0-a-ok" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#0fc373"/></marker><marker id="fk77ef0cc0-a-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#767676"/></marker></defs><g class="fk-box"><rect x="100" y="86" width="230" height="86" rx="6" class="k-model"/><text x="215" y="125.1" class="fk-tx t-model" font-size="13" font-weight="700" text-anchor="middle">Agente</text><text x="215" y="141.35" class="fk-tx t-model" font-size="13" font-weight="400" text-anchor="middle">La política elige la acción</text></g><rect x="620" y="62" width="250" height="146" rx="6" class="k-data fk-soft"/><text x="745" y="82" class="fk-tx t-data" font-size="13" font-weight="700" text-anchor="middle">Entorno</text><rect x="665" y="92" width="160" height="96" rx="3" class="k-neutral"/><g class="ml-k1"><rect x="672" y="100" width="21" height="9" rx="1" class="k-data"/></g><g class="ml-k2"><rect x="697.5" y="100" width="21" height="9" rx="1" class="k-data"/></g><g class="ml-k3"><rect x="723" y="100" width="21" height="9" rx="1" class="k-data"/></g><g class="ml-k4"><rect x="748.5" y="100" width="21" height="9" rx="1" class="k-data"/></g><g class="ml-k5"><rect x="774" y="100" width="21" height="9" rx="1" class="k-data"/></g><g class="ml-k6"><rect x="799.5" y="100" width="21" height="9" rx="1" class="k-data"/></g><g class="ml-paddle"><rect x="722" y="176" width="44" height="7" rx="2" class="k-model"/></g><g class="ml-ball"><circle cx="684" cy="164" r="5" class="k-error "/></g><g class="fk-anim" style="--fk-i:0;--fk-n:3"><polyline points="690,208 690,236 180,236" class="fk-line s-data fk-flow" fill="none"/><path d="M180,236 L180,177.36" class="fk-line s-data fk-flow" fill="none" stroke-dasharray="5 4" marker-end="url(#fk77ef0cc0-a-data)"/><text x="435" y="230" class="fk-tx t-data" font-size="11" font-weight="700" text-anchor="middle">Paso 1: observar el estado s(t)</text></g><g class="fk-anim" style="--fk-i:1;--fk-n:3"><polyline points="260,86 260,40 745,40" class="fk-line s-model fk-flow" fill="none"/><path d="M745,40 L745,56.64" class="fk-line s-model fk-flow" fill="none" stroke-dasharray="5 4" marker-end="url(#fk77ef0cc0-a-model)"/><text x="500" y="34" class="fk-tx t-model" font-size="11" font-weight="700" text-anchor="middle">Paso 2: ejecutar la acción a(t)</text></g><g class="fk-anim" style="--fk-i:2;--fk-n:3"><polyline points="800,208 800,262 250,262" class="fk-line s-ok fk-flow" fill="none"/><path d="M250,262 L250,177.36" class="fk-line s-ok fk-flow" fill="none" stroke-dasharray="5 4" marker-end="url(#fk77ef0cc0-a-ok)"/><text x="525" y="256" class="fk-tx t-ok" font-size="11" font-weight="700" text-anchor="middle">Paso 3: recibir la recompensa r(t+1) y el siguiente estado</text></g><text x="475" y="122" class="fk-tx t-model" font-size="11" font-weight="700" text-anchor="middle">Objetivo: maximizar la</text><text x="475" y="138" class="fk-tx t-model" font-size="11" font-weight="700" text-anchor="middle">recompensa acumulada</text></svg>
