<svg width="988" height="302" xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 988 302" role="img" aria-label="Qué aprenden las capas de una red convolucional" class="cnn-fig fk fk-svg"><style>.fk text{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#242424;stroke:none}.fk rect,.fk circle,.fk polygon{stroke-width:1.6}.fk .fk-line{stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}.fk .fk-conn{stroke-width:1;opacity:.55}.fk .fk-cell{stroke-width:1}.fk .fk-muted{fill:#767676}.fk .fk-halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.fk .k-data{fill:#e8f1fd;stroke:#1174e6}.fk .t-data{fill:#0050ca}.fk .k-model{fill:#e4f3f3;stroke:#23969a}.fk .s-model{stroke:#23969a}.fk .t-model{fill:#1b7478}.fk .k-neutral{fill:#f2f2f2;stroke:#767676}.fk .s-neutral{stroke:#767676}.fk .t-neutral{fill:#242424}</style><rect x="-14" y="-14" width="988" height="302" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" style="stroke-width:1"/><title>Qué aprenden las capas de una red convolucional</title><desc>Early layers detect edges, middle layers corners, circles and textures, deep layers object parts, and a dense head turns them into class scores. An optional residual connection skips from early to deep layers.</desc><defs><marker id="fk8ccc0f18-a-data" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#1174e6"/></marker><marker id="fk8ccc0f18-a-model" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#23969a"/></marker><marker id="fk8ccc0f18-a-latent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#976cf4"/></marker><marker id="fk8ccc0f18-a-error" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#ff8c0a"/></marker><marker id="fk8ccc0f18-a-anom" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#e65d6a"/></marker><marker id="fk8ccc0f18-a-ok" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#0fc373"/></marker><marker id="fk8ccc0f18-a-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#767676"/></marker></defs><g class="fk-box"><rect x="16" y="50" width="128" height="150" rx="6" class="k-data"/></g><text x="80" y="170" class="fk-tx t-data" font-size="13" font-weight="600" text-anchor="middle">Entrada</text><text font-weight="600" x="80" y="187" class="fk-tx fk-muted" font-size="11" text-anchor="middle">Píxeles</text><g class="fk-matrix"><rect x="48" y="68" width="16" height="16" class="k-data fk-cell"/><rect x="64" y="68" width="16" height="16" class="k-data fk-cell"/><rect x="80" y="68" width="16" height="16" class="k-data fk-cell"/><rect x="96" y="68" width="16" height="16" class="k-data fk-cell"/><rect x="48" y="84" width="16" height="16" class="k-data fk-cell"/><rect x="64" y="84" width="16" height="16" class="k-neutral fk-cell"/><rect x="80" y="84" width="16" height="16" class="k-neutral fk-cell"/><rect x="96" y="84" width="16" height="16" class="k-data fk-cell"/><rect x="48" y="100" width="16" height="16" class="k-data fk-cell"/><rect x="64" y="100" width="16" height="16" class="k-data fk-cell"/><rect x="80" y="100" width="16" height="16" class="k-neutral fk-cell"/><rect x="96" y="100" width="16" height="16" class="k-data fk-cell"/><rect x="48" y="116" width="16" height="16" class="k-data fk-cell"/><rect x="64" y="116" width="16" height="16" class="k-data fk-cell"/><rect x="80" y="116" width="16" height="16" class="k-data fk-cell"/><rect x="96" y="116" width="16" height="16" class="k-data fk-cell"/></g><g class="fk-box"><rect x="174" y="50" width="128" height="150" rx="6" class="k-model"/></g><text x="238" y="170" class="fk-tx t-model" font-size="13" font-weight="600" text-anchor="middle">Primeras capas</text><text font-weight="600" x="238" y="187" class="fk-tx fk-muted" font-size="11" text-anchor="middle">Bordes y barras</text><path d="M192.0,100 h24 M232.0,86 v28 M258.0,114 l24,-28" class="fk-line s-model"/><path d="M147,125 L167.64,125" class="fk-line s-neutral" fill="none" marker-end="url(#fk8ccc0f18-a-neutral)"/><g class="fk-box"><rect x="332" y="50" width="128" height="150" rx="6" class="k-model"/></g><text x="396" y="170" class="fk-tx t-model" font-size="13" font-weight="600" text-anchor="middle">Capas intermedias</text><text font-weight="600" x="396" y="187" class="fk-tx fk-muted" font-size="11" text-anchor="middle">Esquinas y texturas</text><circle cx="360.0" cy="100" r="12" class="fk-line s-model"/><rect x="382.0" y="88" width="24" height="24" class="fk-line s-model"/><path d="M416.0,88 v24 h24" class="fk-line s-model"/><path d="M305,125 L325.64,125" class="fk-line s-neutral" fill="none" marker-end="url(#fk8ccc0f18-a-neutral)"/><g class="fk-box"><rect x="490" y="50" width="128" height="150" rx="6" class="k-model"/></g><text x="554" y="170" class="fk-tx t-model" font-size="13" font-weight="600" text-anchor="middle">Capas profundas</text><text font-weight="600" x="554" y="187" class="fk-tx fk-muted" font-size="11" text-anchor="middle">Partes de objetos</text><rect x="520.0" y="82" width="68" height="24" rx="6" class="fk-line s-model"/><circle cx="536.0" cy="114" r="9" class="fk-line s-model"/><circle cx="572.0" cy="114" r="9" class="fk-line s-model"/><path d="M463,125 L483.64,125" class="fk-line s-neutral" fill="none" marker-end="url(#fk8ccc0f18-a-neutral)"/><g class="fk-box"><rect x="648" y="50" width="128" height="150" rx="6" class="k-model"/></g><text x="712" y="170" class="fk-tx t-model" font-size="13" font-w